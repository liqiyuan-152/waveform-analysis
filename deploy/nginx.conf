server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 302 /waveform-analysis/;
  }

  location /waveform-analysis/ {
    try_files $uri $uri/ /waveform-analysis/index.html;
  }
}
