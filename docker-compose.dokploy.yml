services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    image: local/waveform-analysis:git
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:18089:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
