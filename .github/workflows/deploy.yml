name: Deploy demo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: tag-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: DEMO_BASE_PATH=/waveform-analysis/ pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-analysis-site
          path: dist-demo
          if-no-files-found: error

  deploy:
    needs: [tag-gate, build]
    if: needs.tag-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waveform-analysis-site
          path: site
      - name: Upload and activate release
        shell: bash
        env:
          DEPLOY_API_TOKEN: ${{ secrets.DEPLOY_API_TOKEN }}
        run: |
          test -n "$DEPLOY_API_TOKEN"
          tar -C site -czf site.tar.gz .
          curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 900 \
            -X POST "https://lqycustomsite.online/deployment-hook/projects/waveform-analysis/releases/${GITHUB_REF_NAME}" \
            -H "Authorization: Bearer ${DEPLOY_API_TOKEN}" \
            -H "X-Deployment-Commit: ${GITHUB_SHA}" \
            -H "Content-Type: application/gzip" \
            --data-binary @site.tar.gz
