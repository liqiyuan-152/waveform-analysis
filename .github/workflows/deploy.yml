name: Deploy demo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: waveform-analysis-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/issue_triage_agent.py --self-test
      - run: pnpm typecheck
      - run: pnpm check:file-length
      - run: pnpm lint:oxlint
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm pack --dry-run

  deploy:
    needs: verify
    runs-on: [self-hosted, waveform-analysis]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate protected release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Download, build, activate, and verify release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source_dir=$(mktemp -d "${RUNNER_TEMP}/waveform-analysis-source.XXXXXX")
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar -xz --strip-components=1 -C "$source_dir"
          "$source_dir/deploy/deploy-self-hosted-demo.sh" "$GITHUB_REF_NAME" "$GITHUB_SHA"
