name: Issue triage agent

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && !github.event.issue.pull_request) ||
        (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          github.event.comment.user.type != 'Bot' &&
          contains(github.event.comment.body, '/bot')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL || vars.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL }}
      TRIAGE_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run issue triage agent
        run: python3 scripts/issue_triage_agent.py
