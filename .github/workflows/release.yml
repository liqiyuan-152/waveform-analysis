name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: waveform-analysis-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run_id: ${{ steps.artifacts.outputs.run-id }}
      package_version: ${{ steps.version.outputs.package_version }}
      npm_dist_tag: ${{ steps.version.outputs.npm_dist_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          tag_pattern='^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
          if [[ ! "$tag_name" =~ $tag_pattern ]]; then
            echo "Release tags must use vX.Y.Z or vX.Y.Z-prerelease format." >&2
            exit 1
          fi

          package_version="${BASH_REMATCH[1]}"
          source_version="$(node -p "require('./package.json').version")"
          if [[ "$source_version" != "$package_version" ]]; then
            echo "package.json version $source_version does not match tag $tag_name" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            echo "npm_dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Find successful CI artifacts for this commit
        id: artifacts
        run: node scripts/find-verified-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  verify:
    needs: prepare
    if: needs.prepare.outputs.run_id == ''
    uses: ./.github/workflows/verify.yml
    with:
      coverage_workers: 3

  release:
    needs: [prepare, verify]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.verify.result == 'success' ||
           (needs.verify.result == 'skipped' && needs.prepare.outputs.run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      package_version: ${{ needs.prepare.outputs.package_version }}
      npm_dist_tag: ${{ needs.prepare.outputs.npm_dist_tag }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Download the verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ github.sha }}
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}
      - name: Verify artifact commit, version, checksums and Demo path
        run: node scripts/release-artifacts.mjs verify
      - run: pnpm install --frozen-lockfile
      - name: Install browser for package consumer checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the release tarball
        run: pnpm test:package --tarball "release-assets/waveform-analysis-${package_version}.tgz"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPMJS_PUBLISH_TOKEN is required for npm publish." >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check "waveform-analysis-${package_version}.tgz.sha256")
          npm publish "./release-assets/waveform-analysis-${package_version}.tgz" --tag "$npm_dist_tag" --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.prerelease }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release-assets/*

  deploy-demo:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # The server pulls the public Demo asset, checks GitHub's digest, and switches
      # the static directory. No production branch promotion or source-clone webhook.
      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            published="$(curl --silent --fail --connect-timeout 5 --max-time 10 \
              "https://lqycustomsite.online/waveform-analysis/version.txt?run=$GITHUB_RUN_ID" || true)"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "Verified deployed release $GITHUB_REF_NAME at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not publish $GITHUB_SHA; inspect waveform-demo-sync.service logs on the server." >&2
          exit 1
