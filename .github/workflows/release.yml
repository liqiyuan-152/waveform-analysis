name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: waveform-analysis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          tag_pattern='^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
          if [[ ! "$tag_name" =~ $tag_pattern ]]; then
            echo "Release tags must use vX.Y.Z or vX.Y.Z-prerelease format." >&2
            exit 1
          fi

          package_version="${BASH_REMATCH[1]}"
          source_version="$(node -p "require('./package.json').version")"
          if [[ "$source_version" != "$package_version" ]]; then
            echo "package.json version $source_version does not match tag $tag_name" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            echo "npm_dist_tag=next" >> "$GITHUB_ENV"
            echo "prerelease=true" >> "$GITHUB_ENV"
          else
            echo "npm_dist_tag=latest" >> "$GITHUB_ENV"
            echo "prerelease=false" >> "$GITHUB_ENV"
          fi
          echo "package_version=$package_version" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:file-length
      - run: pnpm lint:oxlint
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm test:package

      - name: Pack release assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm pack --pack-destination artifacts
          package_file="$(find artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          install -d release-assets
          published_name="waveform-analysis-${package_version}.tgz"
          install -m 644 "$package_file" "release-assets/$published_name"
          sha256sum "release-assets/$published_name" > "release-assets/$published_name.sha256"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPMJS_PUBLISH_TOKEN is required for npm publish." >&2
            exit 1
          fi
          npm publish "./release-assets/waveform-analysis-${package_version}.tgz" --tag "$npm_dist_tag" --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.prerelease }}
          generate_release_notes: true
          files: release-assets/*

  deploy-demo:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the verified release
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/production | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push origin \
              --force-with-lease="refs/heads/production:$remote_sha" \
              "$GITHUB_SHA:refs/heads/production"
          else
            git push origin "$GITHUB_SHA:refs/heads/production"
          fi

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_DEPLOY_URL"
          jq -n --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" \
            '{ref:"refs/heads/production",after:$sha,head_commit:{id:$sha,message:("Release " + $tag)},commits:[{modified:["package.json"]}]}' \
            > deploy-payload.json
          curl --fail-with-body --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 60 \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary @deploy-payload.json \
            "$DOKPLOY_DEPLOY_URL"

      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            published="$(curl --silent --fail --connect-timeout 5 --max-time 10 \
              "https://lqycustomsite.online/waveform-analysis/version.txt?run=$GITHUB_RUN_ID" || true)"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "Verified deployed release $GITHUB_REF_NAME at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not publish $GITHUB_SHA; inspect the Dokploy deployment logs." >&2
          exit 1
