name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: waveform-analysis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack executable
        id: wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-wasm-pack-0.14.0-rust-1.95.0
      - if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          tag_pattern='^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
          if [[ ! "$tag_name" =~ $tag_pattern ]]; then
            echo "Release tags must use vX.Y.Z or vX.Y.Z-prerelease format." >&2
            exit 1
          fi

          package_version="${BASH_REMATCH[1]}"
          source_version="$(node -p "require('./package.json').version")"
          if [[ "$source_version" != "$package_version" ]]; then
            echo "package.json version $source_version does not match tag $tag_name" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            echo "npm_dist_tag=next" >> "$GITHUB_ENV"
            echo "prerelease=true" >> "$GITHUB_ENV"
          else
            echo "npm_dist_tag=latest" >> "$GITHUB_ENV"
            echo "prerelease=false" >> "$GITHUB_ENV"
          fi
          echo "package_version=$package_version" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:wasm
      - run: pnpm typecheck
      - name: Verify native boundary, licenses and examples
        run: |
          set -eu
          pnpm check:native-boundary
          pnpm check:licenses
          pnpm typecheck:examples
      - run: pnpm check:file-length
      - run: pnpm lint:oxlint
      - run: pnpm lint
      - name: Verify Demo artifact deployment and rollback
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: pnpm test:coverage --maxWorkers=5
      - run: pnpm build
        env:
          DEMO_BASE_PATH: /waveform-analysis/
      - name: Install browser for package consumer checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser interactions
        run: pnpm test:browser:built
        env:
          WAVEFORM_BROWSER: chromium
          WAVEFORM_BROWSER_EVIDENCE_DIR: artifacts/browser
      - name: Pack release assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm --config.ignore-scripts=true pack --pack-destination release-assets
          published_name="waveform-analysis-${package_version}.tgz"
          sha256sum "release-assets/$published_name" > "release-assets/$published_name.sha256"

      - name: Pack the built Demo for artifact deployment
        if: env.prerelease == 'false'
        run: python3 deploy/demo_release.py pack --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

      - name: Verify the release tarball
        run: pnpm test:package --tarball "release-assets/waveform-analysis-${package_version}.tgz"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPMJS_PUBLISH_TOKEN is required for npm publish." >&2
            exit 1
          fi
          sha256sum --check "release-assets/waveform-analysis-${package_version}.tgz.sha256"
          npm publish "./release-assets/waveform-analysis-${package_version}.tgz" --tag "$npm_dist_tag" --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.prerelease }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release-assets/*

      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-chromium
          path: artifacts/browser
          retention-days: 14

  deploy-demo:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # The server pulls the public Demo asset, checks GitHub's digest, and switches
      # the static directory. No production branch promotion or source-clone webhook.
      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            published="$(curl --silent --fail --connect-timeout 5 --max-time 10 \
              "https://lqycustomsite.online/waveform-analysis/version.txt?run=$GITHUB_RUN_ID" || true)"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "Verified deployed release $GITHUB_REF_NAME at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not publish $GITHUB_SHA; inspect the Dokploy deployment logs." >&2
          exit 1
