name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: waveform-analysis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          tag_pattern='^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
          if [[ ! "$tag_name" =~ $tag_pattern ]]; then
            echo "Release tags must use vX.Y.Z or vX.Y.Z-prerelease format." >&2
            exit 1
          fi

          package_version="${BASH_REMATCH[1]}"
          source_version="$(node -p "require('./package.json').version")"
          if [[ "$source_version" != "$package_version" ]]; then
            echo "package.json version $source_version does not match tag $tag_name" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            echo "npm_dist_tag=next" >> "$GITHUB_ENV"
            echo "prerelease=true" >> "$GITHUB_ENV"
          else
            echo "npm_dist_tag=latest" >> "$GITHUB_ENV"
            echo "prerelease=false" >> "$GITHUB_ENV"
          fi
          echo "package_version=$package_version" >> "$GITHUB_ENV"

      - name: Wait for verified CI assets
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const { waitForReleaseAssets } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release-ci.mjs')
            const result = await waitForReleaseAssets({ github, context, log: core.info })
            core.setOutput('run-id', result.runId)
            core.setOutput('artifact-id', result.artifactId)

      - name: Download verified CI assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}
          artifact-ids: ${{ steps.ci.outputs.artifact-id }}
          merge-multiple: true
          path: release-assets

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check "waveform-analysis-${package_version}.tgz.sha256"
          test "$(tar -xOf "waveform-analysis-${package_version}.tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" = "$package_version"
          if [[ "$prerelease" == 'false' ]]; then
            sha256sum --check "waveform-demo-${package_version}.tar.gz.sha256"
            test "$(tar -xOf "waveform-demo-${package_version}.tar.gz" version.txt)" = "$GITHUB_SHA"
          fi

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPMJS_PUBLISH_TOKEN is required for npm publish." >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check "waveform-analysis-${package_version}.tgz.sha256")
          npm publish "./release-assets/waveform-analysis-${package_version}.tgz" --tag "$npm_dist_tag" --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.prerelease }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release-assets/*

  deploy-demo:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # The server pulls the public Demo asset, checks GitHub's digest, and switches
      # the static directory. No production branch promotion or source-clone webhook.
      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            published="$(curl --silent --fail --connect-timeout 5 --max-time 10 \
              "https://lqycustomsite.online/waveform-analysis/version.txt?run=$GITHUB_RUN_ID" || true)"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "Verified deployed release $GITHUB_REF_NAME at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not publish $GITHUB_SHA; inspect waveform-demo-sync.service logs on the server." >&2
          exit 1
