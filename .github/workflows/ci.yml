name: waveform-analysis-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install locked dependencies
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate && pnpm install --frozen-lockfile
      - run: pnpm prepare:wasm
      - run: python3 scripts/issue_triage_agent.py --self-test
      - run: pnpm lint:all
      - name: Verify source length
        run: pnpm check:file-length
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test:coverage
      - name: Build package and Demo
        run: pnpm build
      - run: pnpm test:package
