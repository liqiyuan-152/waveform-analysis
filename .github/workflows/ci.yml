name: waveform-analysis-ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      coverage_workers:
        description: Coverage worker count for a comparable CI run
        type: choice
        options: ['3', '5']
        default: '3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.coverage_workers || '3' }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      coverage_workers: ${{ fromJSON(inputs.coverage_workers || '3') }}
