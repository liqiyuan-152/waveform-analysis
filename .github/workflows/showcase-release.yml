name: Showcase release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a stable Release or restore a recorded deployment
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      release_tag:
        description: Existing stable Release tag to build and deploy
        required: false
        type: string
      rollback_request_id:
        description: Recorded successful deployment request ID to restore
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-and-deploy:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'deploy') || (github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Validate selected stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - name: Verify exact release source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm check:file-length
          pnpm lint:oxlint
          pnpm lint
          pnpm test:coverage
          DEMO_BASE_PATH=/ pnpm build:demo
      - name: Login to GHCR
        run: echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Build immutable Demo image
        id: image
        env:
          TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/liqiyuan-152/waveform-analysis-demo:$TAG"
          docker buildx build --platform linux/amd64 --build-arg DEMO_BASE_PATH=/ \
            --metadata-file image-metadata.json --tag "$image" --push .
          digest="$(jq -r '."containerimage.digest"' image-metadata.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "${image%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - name: Create restricted deployment manifest
        env:
          TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          jq -n --arg request "waveform-analysis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg version "$TAG" --arg source_sha "$(git rev-parse HEAD)" \
            --arg image "$IMAGE" --argjson workflow_run "$GITHUB_RUN_ID" \
            '{request_id:$request,repository:"waveform-analysis",version:$version,source_sha:$source_sha,workflow_run:$workflow_run,required_schema_version:0,services:[{name:"waveform-analysis",image:$image}]}' > release-manifest.json
          jq -e '.services[0].image | test("@sha256:[a-f0-9]{64}$")' release-manifest.json >/dev/null
          cat release-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy through restricted SSH entrypoint
        run: |
          set -euo pipefail
          install -m 600 <(printf '%s' '${{ secrets.DEPLOY_SSH_KEY }}') /tmp/deploy-key
          install -m 600 <(printf '%s' '${{ secrets.DEPLOY_KNOWN_HOSTS }}') /tmp/known-hosts
          ssh_options=(-i /tmp/deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known-hosts)
          cat release-manifest.json | ssh "${ssh_options[@]}" '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'rollback'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Validate recorded deployment request
        env:
          REQUEST_ID: ${{ github.event.inputs.rollback_request_id }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{8,128}$ ]]
      - name: Restore retained immutable image state
        env:
          REQUEST_ID: ${{ github.event.inputs.rollback_request_id }}
        run: |
          set -euo pipefail
          install -m 600 <(printf '%s' '${{ secrets.DEPLOY_SSH_KEY }}') /tmp/deploy-key
          install -m 600 <(printf '%s' '${{ secrets.DEPLOY_KNOWN_HOSTS }}') /tmp/known-hosts
          ssh -i /tmp/deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/tmp/known-hosts \
            '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' "rollback-last $REQUEST_ID"
